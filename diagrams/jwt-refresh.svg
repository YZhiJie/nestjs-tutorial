<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="jwtTitle jwtDesc">
  <title id="jwtTitle">JWT 刷新令牌轮换与重放检测</title>
  <desc id="jwtDesc">登录签发 access 与 refresh；刷新时条件更新吊销旧令牌并签发新令牌；已吊销令牌再次出现时吊销整个 family。</desc>
  <defs>
    <marker id="jwtArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d4653" />
    </marker>
    <marker id="jwtArrowDanger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3244d" />
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="470" rx="16" fill="#f8f9fb" stroke="#d5dae2" />
  <text x="48" y="50" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="24" font-weight="700" fill="#14181f">刷新令牌轮换：正常路径与重放检测</text>
  <text x="48" y="76" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#5b6472">每次刷新都换新令牌；旧令牌再次出现，说明可能被盗，只能吊销整条 family</text>

  <!-- 参与者 -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="15" font-weight="600" fill="#14181f" text-anchor="middle">
    <rect x="60" y="104" width="180" height="48" rx="9" fill="#e8f1f7" stroke="#7fa6bf" />
    <text x="150" y="134">浏览器</text>
    <rect x="390" y="104" width="180" height="48" rx="9" fill="#e6f3ec" stroke="#7fb99a" />
    <text x="480" y="134">API</text>
    <rect x="720" y="104" width="180" height="48" rx="9" fill="#fce8ef" stroke="#d98aa4" />
    <text x="810" y="134">数据库 refresh_tokens</text>
  </g>

  <g stroke="#aab3c0" stroke-width="1.4" stroke-dasharray="5 5">
    <line x1="150" y1="152" x2="150" y2="400" />
    <line x1="480" y1="152" x2="480" y2="400" />
    <line x1="810" y1="152" x2="810" y2="400" />
  </g>

  <!-- 1 登录 -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif">
    <text x="60" y="186" font-size="13" font-weight="600" fill="#1f5f8b">1 · 登录</text>
    <g stroke="#3d4653" stroke-width="1.8" fill="none" marker-end="url(#jwtArrow)">
      <line x1="150" y1="200" x2="474" y2="200" />
    </g>
    <text x="312" y="192" font-size="13" fill="#46505f" text-anchor="middle">POST /auth/login</text>

    <g stroke="#3d4653" stroke-width="1.8" fill="none" marker-end="url(#jwtArrow)">
      <line x1="480" y1="224" x2="804" y2="224" />
    </g>
    <text x="642" y="216" font-size="13" fill="#46505f" text-anchor="middle">写 refresh_token（新建 family）</text>

    <g stroke="#3d4653" stroke-width="1.8" fill="none" marker-end="url(#jwtArrow)">
      <line x1="480" y1="248" x2="156" y2="248" />
    </g>
    <text x="318" y="240" font-size="13" fill="#46505f" text-anchor="middle">access（15 分钟）+ refresh（7 天）</text>
  </g>

  <!-- 2 刷新 -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif">
    <text x="60" y="292" font-size="13" font-weight="600" fill="#1f5f8b">2 · 正常刷新</text>
    <g stroke="#3d4653" stroke-width="1.8" fill="none" marker-end="url(#jwtArrow)">
      <line x1="150" y1="306" x2="474" y2="306" />
      <line x1="480" y1="330" x2="804" y2="330" />
      <line x1="480" y1="354" x2="156" y2="354" />
    </g>
    <text x="312" y="298" font-size="13" fill="#46505f" text-anchor="middle">POST /auth/refresh</text>
    <text x="642" y="322" font-size="13" fill="#46505f" text-anchor="middle">条件更新：旧令牌置为已吊销 + 写新令牌</text>
    <text x="318" y="346" font-size="13" fill="#46505f" text-anchor="middle">新令牌对（旧的立即失效）</text>
  </g>

  <!-- 3 重放 -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif">
    <text x="60" y="404" font-size="13" font-weight="600" fill="#b3244d">3 · 重放</text>
    <g stroke="#b3244d" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#jwtArrowDanger)">
      <line x1="150" y1="418" x2="474" y2="418" />
      <line x1="480" y1="440" x2="804" y2="440" />
    </g>
    <text x="312" y="410" font-size="13" fill="#8f1c3e" text-anchor="middle">已吊销的旧 refresh 再次使用</text>
    <text x="642" y="432" font-size="13" fill="#8f1c3e" text-anchor="middle">replaced_by_token_id 非空 → 判定重放</text>
    <text x="150" y="458" font-size="13" fill="#8f1c3e">响应 401 AUTH_REFRESH_REUSED，吊销整个 family</text>
  </g>
</svg>
