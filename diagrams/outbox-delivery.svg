<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="outboxTitle outboxDesc">
  <title id="outboxTitle">Outbox 消息投递</title>
  <desc id="outboxDesc">业务表与 outbox_events 在同一事务写入，relay 扫描未投递事件写入队列，消费方按事件 id 幂等处理；崩溃后未标记的事件会被重新投递。</desc>
  <defs>
    <marker id="obArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d4653" />
    </marker>
    <marker id="obArrowDanger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3244d" />
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="450" rx="16" fill="#f8f9fb" stroke="#d5dae2" />
  <text x="48" y="50" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="24" font-weight="700" fill="#14181f">Outbox：先落库，再投递</text>
  <text x="48" y="76" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#5b6472">业务写入与事件写入同事务提交；投递失败只影响延迟，不产生「库写了消息丢了」</text>

  <!-- 事务边界 -->
  <rect x="44" y="104" width="310" height="230" rx="12" fill="#fff4f6" stroke="#b3244d" stroke-dasharray="6 4" />
  <text x="64" y="132" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="13" font-weight="600" fill="#8f1c3e">同一个数据库事务</text>

  <rect x="66" y="150" width="266" height="62" rx="9" fill="#ffffff" stroke="#3d4653" />
  <text x="199" y="176" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="15" font-weight="600" fill="#14181f" text-anchor="middle">业务表 users</text>
  <text x="199" y="198" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#46505f" text-anchor="middle">INSERT / UPDATE</text>

  <rect x="66" y="232" width="266" height="62" rx="9" fill="#ffffff" stroke="#3d4653" />
  <text x="199" y="258" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="15" font-weight="600" fill="#14181f" text-anchor="middle">outbox_events</text>
  <text x="199" y="280" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#46505f" text-anchor="middle">id / type / payload / published_at</text>

  <text x="199" y="322" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#8f1c3e" text-anchor="middle">COMMIT 成功 = 事件一定存在</text>

  <!-- relay -->
  <rect x="396" y="150" width="176" height="86" rx="10" fill="#e8f1f7" stroke="#7fa6bf" />
  <text x="484" y="180" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="16" font-weight="600" fill="#14181f" text-anchor="middle">relay 进程</text>
  <text x="484" y="204" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#46505f" text-anchor="middle">SELECT … FOR UPDATE</text>
  <text x="484" y="222" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#46505f" text-anchor="middle">SKIP LOCKED</text>

  <!-- 队列 -->
  <rect x="616" y="150" width="150" height="86" rx="10" fill="#e6f3ec" stroke="#7fb99a" />
  <text x="691" y="180" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="16" font-weight="600" fill="#14181f" text-anchor="middle">队列</text>
  <text x="691" y="204" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#46505f" text-anchor="middle">BullMQ</text>
  <text x="691" y="222" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#46505f" text-anchor="middle">at-least-once</text>

  <!-- 消费方 -->
  <rect x="616" y="288" width="150" height="82" rx="10" fill="#e6f3ec" stroke="#7fb99a" />
  <text x="691" y="316" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="16" font-weight="600" fill="#14181f" text-anchor="middle">消费方</text>
  <text x="691" y="340" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#46505f" text-anchor="middle">按事件 id 去重</text>
  <text x="691" y="358" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#46505f" text-anchor="middle">副作用可重试</text>

  <rect x="396" y="288" width="176" height="82" rx="10" fill="#ffffff" stroke="#3d4653" />
  <text x="484" y="316" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="15" font-weight="600" fill="#14181f" text-anchor="middle">标记 published_at</text>
  <text x="484" y="340" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#46505f" text-anchor="middle">成功才标记</text>
  <text x="484" y="358" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#46505f" text-anchor="middle">回写 outbox_events</text>

  <g stroke="#3d4653" stroke-width="1.8" fill="none">
    <line x1="354" y1="193" x2="392" y2="193" marker-end="url(#obArrow)" />
    <line x1="572" y1="193" x2="612" y2="193" marker-end="url(#obArrow)" />
    <line x1="691" y1="236" x2="691" y2="284" marker-end="url(#obArrow)" />
    <line x1="616" y1="329" x2="576" y2="329" marker-end="url(#obArrow)" />
  </g>

  <!-- 重试回环 -->
  <path d="M 484 288 L 484 262 L 572 262" fill="none" stroke="#b3244d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#obArrowDanger)" />
  <text x="492" y="278" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="12" fill="#8f1c3e">失败重试</text>

  <text x="48" y="404" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#46505f">崩溃恢复：relay 挂掉时 published_at 仍未写入，重启后会再次投递；重复投递由消费方的幂等键兜住。</text>
  <text x="48" y="428" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#5b6472">本仓库当前只实现队列与重试，outbox_events 与 relay 属于设计示例，未落地。</text>
</svg>
